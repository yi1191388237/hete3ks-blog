<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hete3ks · 管理后台</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="admin-shell">
<header class="admin-header"><a href="./" class="admin-brand">Hete3ks <span>EDITORIAL DESK</span></a><a href="./">返回博客 ↗</a></header>
<section id="loginView" class="login-card"><p class="eyebrow">PRIVATE AREA</p><h1>管理后台</h1><p class="muted">仅限已授权的管理员登录。</p><form id="loginForm"><label>管理员邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button><p id="loginMessage" class="message" aria-live="polite"></p></form><button id="forgotPassword" class="text-button">忘记密码？发送重置邮件</button></section>
<section id="dashboardView" hidden>
<div class="dash-heading"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1>文章与评论</h1><p id="whoami" class="muted"></p></div><button id="logoutBtn" class="secondary">退出登录</button></div>
<div class="tabs"><button class="tab active" data-tab="posts">文章管理</button><button class="tab" data-tab="comments">评论审核 <span id="pendingCount"></span></button></div>
<section id="postsPane" class="pane"><div class="split"><div class="list-panel"><div class="list-heading"><h2>文章列表</h2><button id="newPostBtn">＋ 新建文章</button></div><div id="postList"></div></div>
<div class="editor-panel"><form id="postForm"><input type="hidden" name="id"><div class="editor-top"><h2 id="editorTitle">新建文章</h2><span id="saveStatus" class="muted">未保存</span></div>
<label>文章标题<input name="title" maxlength="180" required placeholder="写一个清晰的标题"></label>
<div class="field-row"><label>分类<input name="category" required value="随笔"></label><label>标签（逗号分隔）<input name="tags" placeholder="思考, 技术, 阅读"></label></div>
<label>URL Slug（留空自动生成）<input name="slug" placeholder="article-slug"></label>
<label>摘要<textarea name="excerpt" rows="2" maxlength="360" placeholder="用于首页卡片和文章简介"></textarea></label>
<div class="field-row"><label>封面字母<input name="cover_symbol" maxlength="3" value="H"></label><label>封面颜色<input name="cover_color" type="color" value="#dce5d5"></label><label>状态<select name="status"><option value="draft">草稿</option><option value="published">发布</option></select></label></div>
<div class="editor-toolbar"><span>Markdown 正文</span><button type="button" id="previewToggle" class="secondary small">预览 / 编辑</button><button type="button" id="insertHeading" class="secondary small">＋ 标题</button><button type="button" id="insertQuote" class="secondary small">＋ 引用</button></div>
<textarea name="content" id="markdownInput" class="markdown-input" required placeholder="# 文章标题&#10;&#10;在这里用 Markdown 写作…"></textarea><div id="markdownPreview" class="markdown-preview" hidden></div>
<div class="editor-actions"><button type="submit">保存文章</button><button type="button" id="deletePostBtn" class="danger" hidden>删除文章</button><button type="button" id="resetPostBtn" class="secondary">清空表单</button></div><p id="postMessage" class="message" aria-live="polite"></p></form></div></div></section>
<section id="commentsPane" class="pane" hidden><div class="list-heading"><div><h2>评论审核</h2><p class="muted">只有“已批准”的评论会显示在公开文章中。</p></div><button id="refreshComments" class="secondary">刷新</button></div><div id="moderationList" class="moderation-list"></div></section>
</section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="admin.js"></script></body></html>
