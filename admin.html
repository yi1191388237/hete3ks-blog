<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理后台 — Hete3ks</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><header class="topbar admin-top"><a class="brand" href="./"><span class="brand-icon">H.</span><span>Hete3ks<small>ADMINISTRATION</small></span></a><a href="./" class="back-site">← 返回博客</a></header>
<main class="admin-wrap"><section id="loginView" class="login-card"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>欢迎回来。</h1><p class="admin-muted">登录后管理博客文章。只有被授权的管理员账号可以操作内容。</p><form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label>密码<input id="password" type="password" autocomplete="current-password" required placeholder="输入密码"></label><button class="btn-primary" type="submit">登录管理后台</button><p id="loginError" class="error" role="alert"></p></form><p class="tiny-help">管理员账号需先在 Supabase Dashboard 中创建并授予 admin 角色。此页面不提供公开注册。</p></section>
<section id="dashboardView" hidden><div class="dashboard-heading"><div><p class="eyebrow">CONTENT STUDIO</p><h1>文章管理</h1><p id="sessionLabel" class="admin-muted"></p></div><button id="logoutBtn" class="btn-quiet">退出登录</button></div>
<div class="dashboard-grid"><section class="editor-card"><div class="editor-title"><h2 id="formTitle">写一篇新文章</h2><span class="draft-indicator">HETE3KS / EDITOR</span></div>
<form id="postForm"><input id="postId" type="hidden"><label>文章标题<input id="title" required maxlength="180" placeholder="输入一个清晰的标题"></label><div class="two-col"><label>文章分类<select id="category"><option>技术</option><option>生活</option><option>阅读</option><option>研究</option><option>随笔</option></select></label><label>状态<select id="status"><option value="draft">草稿</option><option value="published">已发布</option></select></label></div><label>摘要<textarea id="excerpt" rows="2" maxlength="400" placeholder="用一两句话介绍文章"></textarea></label><div class="two-col"><label>封面符号<input id="coverSymbol" maxlength="4" value="H"></label><label>封面颜色<input id="coverColor" type="color" value="#dce2d4"></label></div><label>正文（支持基础 HTML）<textarea id="content" rows="14" required placeholder="<p>正文段落……</p>\n<h2>小标题</h2>"></textarea><span class="field-help">可以使用 &lt;p&gt;、&lt;h2&gt;、&lt;ul&gt;、&lt;li&gt;、&lt;blockquote&gt;、&lt;pre&gt;、&lt;code&gt; 等 HTML 标签。</span></label><div class="editor-actions"><button type="button" id="resetBtn" class="btn-quiet">清空</button><button type="submit" class="btn-primary" id="saveBtn">保存文章</button></div><p id="formMessage" class="form-message" role="status"></p></form></section>
<section class="posts-card"><div class="list-title"><h2>已保存的文章</h2><button id="newPostBtn" class="btn-quiet">＋ 新建</button></div><p class="admin-muted small">草稿仅管理员可见；发布后会显示在公开博客。</p><div id="adminPostList" class="admin-post-list"><p class="admin-muted">正在加载…</p></div></section></div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
